# dsh-mcp-manager bundle patch：向 web profile 名册插入 MCP 管理器。
# 主机端（exports "."）在宿主进程运行，注入 tools / webServer / systemPrompt：
# 管理 <DSH_HOME>/dsh-mcp.json 中的 MCP 服务器（stdio / streamable-http），
# 把已连接服务器的工具注册为 mcp__<id>__<tool>（id 不透明，按 (工作空间, 服务器名) 分配，不可由服务器名推导），并提供 /api/dsh-mcp/* 路由；
# 浏览器端（exports "./client"）提供侧边栏入口与分级面板。
# 配置走 schema 默认值（enabled / announceToAgent），行内不带 config。
#
# DSH >= 0.2.2 自带官方 MCP 管理器（entry id `mcp-manager`，占用服务名
# `mcpManager`）。本插件与它**共存**：自己的服务名是 `mcpManagerPro`，不抢占
# 官方名字，也不停用官方行。两边各管各的配置文件与连接池。
- insert:
    - id: dsh-mcp-manager
      name: '@sunshaobei/dsh-mcp-manager'
